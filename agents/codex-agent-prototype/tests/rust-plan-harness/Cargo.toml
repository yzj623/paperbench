[package]
name = "ppblab-plan-harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
tempfile = "3"
